<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" fill="none">
  <!-- Simple side-view motorcycle illustration used as a placeholder photo -->
  <g stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <!-- wheels -->
    <circle cx="70" cy="128" r="38"/>
    <circle cx="250" cy="128" r="38"/>
    <circle cx="70" cy="128" r="8" fill="#ffffff"/>
    <circle cx="250" cy="128" r="8" fill="#ffffff"/>
    <!-- swingarm & fork -->
    <path d="M70 128 L150 112"/>
    <path d="M250 128 L222 52"/>
    <!-- frame -->
    <path d="M118 74 L170 120 L206 70"/>
    <!-- handlebar -->
    <path d="M214 46 L238 38"/>
  </g>
  <!-- fuel tank -->
  <path d="M150 58 Q178 40 214 54 L206 76 L156 78 Z" fill="#69be28"/>
  <!-- seat & tail -->
  <path d="M74 66 Q110 54 154 62 L152 76 L100 80 Q84 78 74 66 Z" fill="#ffffff"/>
  <!-- engine block -->
  <rect x="140" y="84" width="48" height="34" rx="6" fill="#3a3d37" stroke="#ffffff" stroke-width="4"/>
  <!-- headlight -->
  <path d="M226 54 L248 60 L238 72 Z" fill="#69be28"/>
</svg>
